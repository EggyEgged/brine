name: CI
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt, vet, tests
        run: make check
      - name: Build release artifacts
        run: make dist deb VERSION=0.0.0-ci
      - name: Shell scripts parse
        run: |
          sh -n packaging/install.sh packaging/install-extras.sh packaging/deb/build-deb.sh scripts/integration-test.sh
          bash -n packaging/aur/PKGBUILD
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  rpm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Version numbers agree
        run: scripts/check-versions.sh "$(sed -n 's/^Version:[[:space:]]*//p' packaging/rpm/brine.spec)"
      - name: Build the RPM and source RPM in Fedora
        run: packaging/rpm/build-rpm.sh
      - name: Install-test the RPM on Fedora 43 and latest
        run: packaging/rpm/test-rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm
